<div class="container">

  <!-- ─── Add Transaction ──────────────────────────── -->
  <section class="card">
    <h2 class="card__title">Add Transaction</h2>

    <form [formGroup]="txForm" (ngSubmit)="save()" class="grid-form">
      <label>
        <span>Reference&nbsp;#</span>
        <input formControlName="transactionRef" placeholder="TX-0001" />
      </label>

      <label>
        <span>Start&nbsp;Date</span>
        <input type="date" formControlName="startDate" />
      </label>

      <label>
        <span>Maturity&nbsp;Date</span>
        <input type="date" formControlName="maturityDate" />
      </label>

      <label>
        <span>Amount&nbsp;(LKR)</span>
        <input type="number" step="0.01" formControlName="amount" />
      </label>

      <label>
        <span>Customer&nbsp;Name</span>
        <input formControlName="customerName" placeholder="Ashan Perera" />
      </label>

      <label>
        <span>NIC</span>
        <input formControlName="customerNic" placeholder="200400400302" />
      </label>

      <div class="actions">
        <button type="submit" [disabled]="txForm.invalid">Save</button>
      </div>
    </form>
  </section>

  <!-- ─── Reports ───────────────────────────────────── -->
  <section class="card">
    <h2 class="card__title">Reports</h2>

    <!-- Outstanding -->
    <div class="report-header">
      <input #asOf type="date" />
      <button class="small" (click)="loadOutstanding(asOf.value)">Outstanding as of</button>
    </div>
    <app-report-table
      *ngIf="outstandingRows.length"
      [rows]="outstandingRows"
      [columns]="['transactionRef', 'amount', 'maturityDate']">
    </app-report-table>

    <!-- Customer -->
    <div class="report-header">
      <input #nic placeholder="NIC" />
      <button class="small" (click)="loadCustomer(nic.value)">Customer outstanding</button>
    </div>
    <app-report-table
      *ngIf="customerRows.length"
      [rows]="customerRows"
      [columns]="['transactionRef', 'amount', 'maturityDate']">
    </app-report-table>

    <!-- Maturity -->
    <div class="report-header">
      <input #mat type="date" />
      <button class="small" (click)="loadMaturity(mat.value)">By maturity date</button>
    </div>
    <app-report-table
      *ngIf="maturityRows.length"
      [rows]="maturityRows"
      [columns]="['transactionRef', 'amount', 'customerName']">
    </app-report-table>
  </section>

</div>
