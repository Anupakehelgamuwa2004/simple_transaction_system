<h2>Add Transaction</h2>
<form [formGroup]="txForm" (ngSubmit)="save()">
  <label>Ref: <input formControlName="transactionRef"></label><br>
  <label>Start: <input type="date" formControlName="startDate"></label><br>
  <label>Maturity: <input type="date" formControlName="maturityDate"></label><br>
  <label>Amount: <input type="number" step="0.01" formControlName="amount"></label><br>
  <label>Customer: <input formControlName="customerName"></label><br>
  <label>NIC: <input formControlName="customerNic"></label><br>
  <button type="submit" [disabled]="txForm.invalid">Save</button>
</form>

<hr>

<h2>Reports</h2>

<h3>Outstanding as of</h3>
<input #asOf type="date">
<button (click)="loadOutstanding(asOf.value)">Load</button>
<table *ngIf="outstandingRows.length">
  <tr><th>Ref</th><th>Amount</th><th>Maturity</th></tr>
  <tr *ngFor="let t of outstandingRows">
    <td>{{t.transactionRef}}</td><td>{{t.amount}}</td><td>{{t.maturityDate}}</td>
  </tr>
</table>

<h3>Customer outstanding</h3>
<input #nic placeholder="NIC">
<button (click)="loadCustomer(nic.value)">Load</button>
<table *ngIf="customerRows.length">
  <tr><th>Ref</th><th>Amount</th><th>Maturity</th></tr>
  <tr *ngFor="let t of customerRows">
    <td>{{t.transactionRef}}</td><td>{{t.amount}}</td><td>{{t.maturityDate}}</td>
  </tr>
</table>

<h3>By maturity date</h3>
<input #mat type="date">
<button (click)="loadMaturity(mat.value)">Load</button>
<table *ngIf="maturityRows.length">
  <tr><th>Ref</th><th>Amount</th><th>Customer</th></tr>
  <tr *ngFor="let t of maturityRows">
    <td>{{t.transactionRef}}</td><td>{{t.amount}}</td><td>{{t.customerName}}</td>
  </tr>
</table>
